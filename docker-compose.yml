services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/tracker.db
      - WIDGET_PATH=/widget/widget.js
      - DASHBOARD_PATH=/dashboard/index.html
    volumes:
      - ./data:/data
      - ./widget:/widget:ro
      - ./dashboard:/dashboard:ro
