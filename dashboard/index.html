<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    tbody tr { cursor: default; }
    tbody tr[data-clickable] { cursor: pointer; }
    pre.meta { font-size: 0.75rem; margin: 0; white-space: pre-wrap; word-break: break-all; }
    .sticky-header { position: sticky; top: 0; z-index: 20; background: #fff; }
    .sticky-thead th { position: sticky; top: 57px; z-index: 10; background: #f8f9fa; box-shadow: inset 0 -1px 0 #dee2e6; }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <span class="navbar-brand mb-0 h1">Tracker Dashboard</span>
  </nav>

  <main class="container-lg" x-data="dashboard">

    <!-- Section 1: Active Sessions -->
    <div class="card mb-4" x-show="!selectedSession">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Active Sessions</h5>
        <small class="text-muted">auto-refreshes every 5s</small>
      </div>
      <div class="card-body p-0">
        <p x-show="sessions.length === 0" class="p-4 mb-0 text-muted">No active sessions in the last 5 minutes</p>
        <table class="table table-hover mb-0" x-show="sessions.length > 0">
          <thead class="table-light">
            <tr><th>Session ID</th><th>Client ID</th><th>Events</th><th>Last Seen</th></tr>
          </thead>
          <tbody>
            <template x-for="s in sessions" :key="s.sessionId">
              <tr data-clickable @click="selectSession(s.sessionId)">
                <td x-text="s.sessionId" :title="s.sessionId"></td>
                <td><code x-text="s.clientId"></code></td>
                <td x-text="s.eventCount"></td>
                <td x-text="relativeTime(s.lastSeen)"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <div x-show="nextCursor" class="p-3 border-top">
          <button class="btn btn-sm btn-outline-secondary" @click="loadMore()">Load more</button>
        </div>
      </div>
    </div>

    <!-- Section 2: Session Detail -->
    <div class="card mb-4" x-show="selectedSession !== null">
      <div class="card-header d-flex align-items-center gap-3 sticky-header">
        <button class="btn btn-sm btn-outline-secondary" @click="back()">&#8592; Back</button>
        <h5 class="mb-0">
          Session:&nbsp;<span x-text="selectedSession || ''"></span>
        </h5>
        <span class="text-muted small ms-2" x-show="selectedClientId">
          client: <strong x-text="selectedClientId"></strong>
        </span>
        <span class="text-muted small ms-auto" x-show="sessionTotal > 0">
          <span x-text="sessionEvents.length"></span> / <span x-text="sessionTotal"></span> events
        </span>
      </div>
      <div class="card-body p-0">
        <table class="table mb-0">
          <thead class="table-light">
            <tr class="sticky-thead"><th>Event Type</th><th>Timestamp</th><th>Metadata</th></tr>
          </thead>
          <tbody>
            <template x-for="e in sessionEvents" :key="e.id">
              <tr>
                <td><span class="badge bg-secondary" x-text="e.eventType"></span></td>
                <td x-text="formatTimestamp(e.timestamp)"></td>
                <td><pre class="meta" x-text="JSON.stringify(e.metadata, null, 2)"></pre></td>
              </tr>
            </template>
          </tbody>
        </table>
        <div x-show="sessionNextCursor" class="p-3 border-top">
          <button class="btn btn-sm btn-outline-secondary" @click="loadMoreEvents()">Load more</button>
        </div>
      </div>
    </div>

    <!-- Section 3: Event Breakdown -->
    <div class="card mb-4" x-show="!selectedSession">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Event Breakdown</h5>
        <small class="text-muted">auto-refreshes every 5s</small>
      </div>
      <div class="card-body">
        <div class="d-flex align-items-center gap-3 mb-3">
          <label class="form-label mb-0 fw-semibold">Client ID:</label>
          <input type="text" class="form-control form-control-sm" style="width:200px"
                 x-model="statsClientId" @input="onClientIdInput()" placeholder="e.g. demo-client">
          <span class="badge bg-primary" x-text="stats.sessionCount + ' active viewer(s)'"></span>
        </div>
        <p x-show="breakdownEntries().length === 0" class="mb-0 text-muted">No events in the last 5 minutes</p>
        <table class="table table-sm mb-0" x-show="breakdownEntries().length > 0">
          <thead class="table-light">
            <tr><th>Event Type</th><th>Count</th></tr>
          </thead>
          <tbody>
            <template x-for="entry in breakdownEntries()" :key="entry.type">
              <tr>
                <td x-text="entry.type"></td>
                <td x-text="entry.count"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const API_BASE = (location.port === '' || location.port === '8080') ? '' : 'http://' + location.hostname + ':8080';

    document.addEventListener('alpine:init', function() {
      Alpine.data('dashboard', function() {
        return {
          sessions: [],
          nextCursor: null,
          selectedSession: null,
          selectedClientId: null,
          sessionEvents: [],
          sessionTotal: 0,
          sessionNextCursor: null,
          stats: { sessionCount: 0, breakdown: {} },
          statsClientId: 'localhost',
          _refreshTimer: null,
          _statsDebounce: null,

          init: function() {
            this.loadSessions();
            this.loadStats();
            this._refreshTimer = setInterval(() => {
              if (!this.selectedSession) {
                this.loadSessions();
                this.loadStats();
              }
            }, 5000);
          },

          loadSessions: function() {
            const self = this;
            fetch(API_BASE + '/sessions')
              .then(function(r) { return r.json(); })
              .then(function(json) {
                if (json.status === 'success') {
                  self.sessions = json.data.items;
                  self.nextCursor = json.data.nextCursor;
                }
              })
              .catch(function(err) { console.error('[dashboard] /sessions failed', err); });
          },

          loadMore: function() {
            if (!this.nextCursor) return;
            const self = this;
            fetch(API_BASE + '/sessions?before=' + encodeURIComponent(self.nextCursor))
              .then(function(r) { return r.json(); })
              .then(function(json) {
                if (json.status === 'success') {
                  self.sessions = self.sessions.concat(json.data.items);
                  self.nextCursor = json.data.nextCursor;
                }
              })
              .catch(function(err) { console.error('[dashboard] /sessions (paginated) failed', err); });
          },

          selectSession: function(sessionId) {
            const self = this;
            self.selectedSession = sessionId;
            self.sessionEvents = [];
            self.sessionNextCursor = null;
            self.sessionTotal = 0;
            self.selectedClientId = null;
            fetch(API_BASE + '/sessions/' + encodeURIComponent(sessionId))
              .then(function(r) { return r.json(); })
              .then(function(json) {
                if (json.status === 'success') {
                  self.sessionEvents = json.data.items;
                  self.sessionNextCursor = json.data.nextCursor;
                  self.sessionTotal = json.data.total;
                  if (json.data.items.length > 0) {
                    self.selectedClientId = json.data.items[0].clientId;
                  }
                }
              })
              .catch(function(err) { console.error('[dashboard] /sessions/:id failed', err); });
          },

          loadMoreEvents: function() {
            if (!this.sessionNextCursor || !this.selectedSession) return;
            const self = this;
            fetch(API_BASE + '/sessions/' + encodeURIComponent(self.selectedSession) + '?before=' + encodeURIComponent(self.sessionNextCursor))
              .then(function(r) { return r.json(); })
              .then(function(json) {
                if (json.status === 'success') {
                  self.sessionEvents = self.sessionEvents.concat(json.data.items);
                  self.sessionNextCursor = json.data.nextCursor;
                }
              })
              .catch(function(err) { console.error('[dashboard] /sessions/:id (paginated) failed', err); });
          },

          back: function() {
            this.selectedSession = null;
            this.selectedClientId = null;
            this.sessionEvents = [];
            this.sessionNextCursor = null;
          },

          loadStats: function() {
            if (!this.statsClientId) return;
            const self = this;
            fetch(API_BASE + '/stats/' + encodeURIComponent(self.statsClientId))
              .then(function(r) { return r.json(); })
              .then(function(json) {
                if (json.status === 'success') {
                  self.stats = json.data;
                }
              })
              .catch(function(err) { console.error('[dashboard] /stats failed', err); });
          },

          onClientIdInput: function() {
            const self = this;
            clearTimeout(self._statsDebounce);
            self._statsDebounce = setTimeout(function() { self.loadStats(); }, 300);
          },

          breakdownEntries: function() {
            const bd = (this.stats && this.stats.breakdown) || {};
            return Object.keys(bd).map(function(k) { return { type: k, count: bd[k] }; });
          },


          relativeTime: function(ts) {
            const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
            if (diff < 60) return diff + 's ago';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            return Math.floor(diff / 3600) + 'h ago';
          },

          formatTimestamp: function(ts) {
            return new Date(ts).toLocaleString();
          }
        };
      });
    });
  </script>

</body>
</html>
